</style></defs><rect width="100%" height="100%" fill="url(#bg)"/><text x="45" y="55" class="t">Bakteriofag T4 — budowa i przyłączenie</text><text x="45" y="84" class="s"><tspan x="45" dy="0">Duży, szczegółowy schemat bakteriofaga T4 z kapsydem, DNA, kołnierzem, kurczliwą osłonką ogonka,</tspan><tspan x="45" dy="21">płytką podstawową i włóknami ogonkowymi oraz małym panelem adsorpcji do komórki bakterii. Oznaczenia</tspan><tspan x="45" dy="21">A–D nie podają nazw.</tspan></text>
