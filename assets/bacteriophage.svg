<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="980" viewBox="0 0 1280 980" role="img" aria-label="Duży, szczegółowy schemat bakteriofaga T4 z kapsydem, DNA, kołnierzem, kurczliwą osłonką ogonka, płytką podstawową i włóknami ogonkowymi oraz małym panelem adsorpcji do komórki bakterii. Oznaczenia A–D nie podają nazw.">
<title>Bakteriofag T4 — budowa i przyłączenie</title><desc>Duży, szczegółowy schemat bakteriofaga T4 z kapsydem, DNA, kołnierzem, kurczliwą osłonką ogonka, płytką podstawową i włóknami ogonkowymi oraz małym panelem adsorpcji do komórki bakterii. Oznaczenia A–D nie podają nazw.</desc><defs>
