<linearGradient id="purple" x1="0" x2="1"><stop stop-color="#f4edf7"/><stop offset="1" stop-color="#d9c2e7"/></linearGradient>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#183735" flood-opacity=".16"/></filter>
