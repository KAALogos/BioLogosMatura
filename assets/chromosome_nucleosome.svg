<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1100" viewBox="0 0 1500 1100">
<defs>
 <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,8 L11,4 z" fill="#274c5e"/></marker>
 <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,8 L11,4 z" fill="#b94a48"/></marker>
 <style>
 .title{font:700 38px Arial,sans-serif;fill:#17212b} .sub{font:23px Arial,sans-serif;fill:#536574}
 .node{stroke:#315667;stroke-width:3;rx:18} .nt{font:700 27px Arial,sans-serif;fill:#17212b}
 .small{font:21px Arial,sans-serif;fill:#4f6170} .label{font:700 22px Arial,sans-serif;fill:#fff}
 .arrow{fill:none;stroke:#274c5e;stroke-width:4;marker-end:url(#arrow)} .arrow-red{fill:none;stroke:#b94a48;stroke-width:4;marker-end:url(#arrow-red)}
 .code{fill:#274c5e;stroke:#fff;stroke-width:2} .codeText{font:700 19px Arial,sans-serif;fill:white;text-anchor:middle;dominant-baseline:middle}
 </style></defs><rect width="100%" height="100%" fill="#fff"/>
<text x="55" y="62" class="title">Upakowanie DNA i budowa chromosomu</text><text x="55" y="102" class="sub">Schemat nie zachowuje wspólnej skali między poziomami organizacji.</text>
<text x="55" y="140" class="small">Panel A pokazuje kolejne poziomy upakowania. Panel B służy do rozpoznawania części chromosomu.</text>
<text class="nt" x="70" y="205">A. Poziomy organizacji DNA</text>
<path d="M100 350 C150 250 210 450 270 350 S390 250 450 350" fill="none" stroke="#315667" stroke-width="7"/><path d="M100 390 C150 290 210 490 270 390 S390 290 450 390" fill="none" stroke="#c85c5c" stroke-width="7"/><circle class="code" cx="275" cy="245" r="24"/><text class="codeText" x="275" y="246">1</text>
<path class="arrow" d="M480 370 L560 370"/>
<g transform="translate(590,285)"><circle cx="0" cy="80" r="28" fill="#bda8cc"/><circle cx="65" cy="80" r="28" fill="#bda8cc"/><circle cx="130" cy="80" r="28" fill="#bda8cc"/><circle cx="195" cy="80" r="28" fill="#bda8cc"/><path d="M-25 80 C20 10 40 150 65 80 S110 10 130 80 S175 150 195 80 S240 10 255 80" fill="none" stroke="#315667" stroke-width="5"/><circle class="code" cx="100" cy="-30" r="24"/><text class="codeText" x="100" y="-29">2</text></g>
<path class="arrow" d="M875 370 L955 370"/>
<path d="M1010 290 C1120 245 1190 470 1300 315 C1360 235 1430 405 1470 355" fill="none" stroke="#315667" stroke-width="28" stroke-linecap="round"/><circle class="code" cx="1230" cy="225" r="24"/><text class="codeText" x="1230" y="226">3</text>
<text class="nt" x="70" y="620">B. Chromosom metafazowy</text>
<path d="M520 680 C610 620 660 705 720 785 C660 865 610 950 520 890" fill="none" stroke="#315667" stroke-width="35" stroke-linecap="round"/><path d="M920 680 C830 620 780 705 720 785 C780 865 830 950 920 890" fill="none" stroke="#c85c5c" stroke-width="35" stroke-linecap="round"/>
<line x1="720" y1="785" x2="1040" y2="785" stroke="#315667" stroke-width="3"/><circle class="code" cx="1080" cy="785" r="24"/><text class="codeText" x="1080" y="786">A</text>
<line x1="570" y1="680" x2="350" y2="610" stroke="#315667" stroke-width="3"/><circle class="code" cx="315" cy="595" r="24"/><text class="codeText" x="315" y="596">B</text>
<line x1="875" y1="680" x2="1090" y2="620" stroke="#315667" stroke-width="3"/><circle class="code" cx="1130" cy="610" r="24"/><text class="codeText" x="1130" y="611">C</text>
<path d="M530 950 C670 1020 800 1020 920 950" fill="none" stroke="#315667" stroke-width="3"/><circle class="code" cx="720" cy="1040" r="24"/><text class="codeText" x="720" y="1041">D</text>
</svg>